services:

  # ─────────────────────────────────────────────
  # 1. Local Telegram Bot API server
  #    Fayl limiti: 50 MB → 2 GB
  # ─────────────────────────────────────────────
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - tg_api_data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────────
  # 2. Vinyl bot
  # ─────────────────────────────────────────────
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Bot ichki tarmoqda local serverni ishlatadi
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
    volumes:
      - ./assets:/app/assets:ro
      - ./temp:/app/temp
    depends_on:
      telegram-bot-api:
        condition: service_healthy

volumes:
  tg_api_data:

